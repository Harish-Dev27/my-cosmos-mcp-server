name: Build and deploy to Azure Container Apps

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-cosmos-mcp
  AZURE_CONTAINER_APP: cosmos-mcp-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select immutable image tag
        id: image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: bd886e03-1b7b-4657-bd2a-b058566111fd
          tenant-id: df559a91-563a-4230-85e9-fbfb218ff1a2
          subscription-id: b4ad081f-0372-41c5-8b0f-cb32aee8027e

      - name: Deploy image to Azure Container App
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          az containerapp ingress update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --target-port 8000

          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE"